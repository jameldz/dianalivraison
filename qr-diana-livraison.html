<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana Detox — Commande en ligne</title>
<meta property="og:title" content="Diana Detox · Le rituel minceur naturel">
<meta property="og:description" content="Café, Thé, Gélules Diana — Ton rituel minceur & bien-être à Marseille et partout en France.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --rose-dark:#A8405C;
  --rose:#D4607A;
  --rose-light:#F5D4DD;
  --rose-softer:#FFF0F4;
  --cream:#FFF9F5;
  --gold:#C8A450;
  --gold-dark:#A68838;
  --gold-light:#E4C67A;
  --ink:#2B1419;
  --ink-soft:#5A3B42;
  --muted:#8B6B73;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Outfit',sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(212,96,122,0.18) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(200,164,80,0.14) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(245,212,221,0.25) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(43,20,25,0.04) 1px, transparent 0);
  background-size:24px 24px;
  pointer-events:none;
  z-index:0;
}

.decor{position:fixed;pointer-events:none;z-index:0;opacity:0.5}
.decor-1{top:5%;right:-60px;width:300px;animation:float 12s ease-in-out infinite}
.decor-2{bottom:10%;left:-80px;width:240px;animation:float 14s ease-in-out infinite reverse}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-20px) rotate(5deg)}
}

.page{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  max-width:560px;
  margin:0 auto;
}

.toplabel{
  font-family:'Outfit',sans-serif;
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold-dark);
  font-weight:600;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:12px;
  opacity:0;
  animation:fadeUp 0.8s 0.1s forwards;
}
.toplabel::before,.toplabel::after{
  content:'';
  width:28px;
  height:1px;
  background:var(--gold);
}

.brand{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(56px,14vw,88px);
  font-weight:500;
  line-height:0.85;
  text-align:center;
  color:var(--ink);
  margin-bottom:8px;
  opacity:0;
  animation:fadeUp 1s 0.2s forwards;
}
.brand em{
  font-style:italic;
  font-weight:400;
  display:block;
  background:linear-gradient(135deg,var(--rose) 0%,var(--gold) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-style:italic;
  color:var(--ink-soft);
  text-align:center;
  margin-bottom:42px;
  letter-spacing:0.3px;
  opacity:0;
  animation:fadeUp 1s 0.4s forwards;
}
.tagline::before{content:'«  '}
.tagline::after{content:'  »'}

.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(212,96,122,0.15);
  border-radius:2px;
  padding:48px 36px 36px;
  position:relative;
  width:100%;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 40px 80px -20px rgba(168,64,92,0.18),
    0 20px 40px -16px rgba(200,164,80,0.12);
  opacity:0;
  animation:fadeUp 1s 0.5s forwards;
}

.card::before,.card::after{
  content:'';
  position:absolute;
  width:40px;
  height:40px;
  border:1.5px solid var(--gold);
}
.card::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.card::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

.qr-frame{
  position:relative;
  padding:24px;
  background:#fff;
  border-radius:2px;
  margin:0 auto 28px;
  width:288px;
  height:288px;
  box-shadow:0 0 0 1px rgba(212,96,122,0.1),0 2px 20px rgba(168,64,92,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
}
.qr-frame::before{
  content:'';
  position:absolute;
  inset:12px;
  border:1px solid var(--rose-light);
  pointer-events:none;
}
.qr-inner{
  width:240px;
  height:240px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
#qrcode{
  display:block;
  width:240px;
  height:240px;
}

.scan-label{
  text-align:center;
  margin-bottom:24px;
  font-family:'Cormorant Garamond',serif;
  font-size:15px;
  font-style:italic;
  color:var(--muted);
  letter-spacing:0.5px;
}
.scan-label strong{
  display:block;
  font-family:'Outfit',sans-serif;
  font-style:normal;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold-dark);
  font-weight:600;
  margin-bottom:6px;
}

.divider{
  display:flex;
  align-items:center;
  gap:14px;
  margin:28px 0 24px;
  color:var(--gold);
}
.divider::before,.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--rose-light),transparent);
}
.divider-icon{font-size:14px;letter-spacing:8px;padding-left:8px}

.cta{
  display:block;
  width:100%;
  padding:18px 24px;
  background:linear-gradient(135deg,var(--rose) 0%,var(--rose-dark) 100%);
  color:#fff;
  text-decoration:none;
  font-family:'Outfit',sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  text-align:center;
  border:none;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 10px 30px -10px rgba(168,64,92,0.5);
}
.cta::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  opacity:0;
  transition:opacity 0.4s;
}
.cta::after{
  content:'';
  position:absolute;
  inset:3px;
  border:1px solid rgba(255,255,255,0.35);
  pointer-events:none;
}
.cta span{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 40px -10px rgba(168,64,92,0.6)}
.cta:hover::before{opacity:1}
.cta:active{transform:translateY(0)}
.arrow{display:inline-block;transition:transform 0.4s}
.cta:hover .arrow{transform:translateX(6px)}

.secondary{display:flex;gap:10px;margin-top:14px}
.mini-btn{
  flex:1;
  padding:12px 8px;
  background:transparent;
  border:1px solid var(--rose-light);
  color:var(--rose-dark);
  font-family:'Outfit',sans-serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.3s;
  text-decoration:none;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}
.mini-btn:hover{background:var(--rose-softer);border-color:var(--rose);color:var(--rose-dark)}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:36px;
  opacity:0;
  animation:fadeUp 1s 0.8s forwards;
}
.feature{text-align:center;padding:16px 8px}
.feature-icon{font-size:20px;display:block;margin-bottom:6px}
.feature-text{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;
  font-style:italic;
  color:var(--ink-soft);
  line-height:1.4;
}
.feature-text strong{
  display:block;
  font-family:'Outfit',sans-serif;
  font-style:normal;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:600;
  color:var(--gold-dark);
  margin-bottom:3px;
}

.footer{
  margin-top:48px;
  text-align:center;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:400;
  opacity:0;
  animation:fadeUp 1s 1s forwards;
}
.footer-dot{color:var(--gold);margin:0 8px}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--ink);
  color:var(--cream);
  padding:14px 24px;
  font-family:'Outfit',sans-serif;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:500;
  transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
  z-index:9999;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .page{padding:24px 16px}
  .card{padding:40px 22px 28px}
  .features{grid-template-columns:1fr;gap:8px}
  .feature{padding:10px}
}

@media print{
  body::before,body::after,.decor,.footer,.secondary,.features{display:none}
  .cta{background:#D4607A !important;-webkit-print-color-adjust:exact}
  .card{box-shadow:none;background:#fff}
}
</style>
</head>
<body>

<svg class="decor decor-1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#C8A450" stroke-width="0.8" opacity="0.4">
    <circle cx="100" cy="100" r="60"/>
    <circle cx="100" cy="100" r="80"/>
    <circle cx="100" cy="100" r="95"/>
    <path d="M100,40 Q130,80 100,100 Q70,120 100,160" stroke-dasharray="2,3"/>
  </g>
</svg>

<svg class="decor decor-2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#D4607A" stroke-width="0.8" opacity="0.3">
    <path d="M20,100 Q60,20 100,100 T180,100"/>
    <path d="M20,120 Q60,40 100,120 T180,120"/>
    <path d="M20,80 Q60,0 100,80 T180,80"/>
  </g>
</svg>

<div class="page">

  <div class="toplabel">Marseille · France</div>

  <h1 class="brand">Diana<em>Detox</em></h1>

  <p class="tagline">Le rituel minceur qui change tout</p>

  <div class="card">

    <div class="qr-frame">
      <div class="qr-inner">
        <canvas id="qrcode" width="240" height="240"></canvas>
      </div>
    </div>

    <div class="scan-label">
      <strong>Scanner pour commander</strong>
      ou clique ci-dessous
    </div>

    <div class="divider">
      <span class="divider-icon">◆ ◆ ◆</span>
    </div>

    <a href="https://dianalivraison.vercel.app/livraison-diana-fixed.html"
       class="cta"
       target="_blank"
       rel="noopener">
      <span>Passer Commande <span class="arrow">→</span></span>
    </a>

    <div class="secondary">
      <button class="mini-btn" onclick="copyUrl()">📋 Copier le lien</button>
      <button class="mini-btn" onclick="window.print()">🖨 Imprimer</button>
    </div>

  </div>

  <div class="features">
    <div class="feature">
      <span class="feature-icon">🌿</span>
      <div class="feature-text">
        <strong>100% Naturel</strong>
        Plantes sélectionnées
      </div>
    </div>
    <div class="feature">
      <span class="feature-icon">🚚</span>
      <div class="feature-text">
        <strong>Livraison</strong>
        Marseille & France
      </div>
    </div>
    <div class="feature">
      <span class="feature-icon">✨</span>
      <div class="feature-text">
        <strong>Résultats</strong>
        En 2 à 3 mois
      </div>
    </div>
  </div>

  <div class="footer">
    dianalivraison<span class="footer-dot">◆</span>vercel<span class="footer-dot">◆</span>app
  </div>

</div>

<div id="toast" class="toast">✓ Lien copié</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
(function(){
  if(typeof QRious==='undefined'){
    var c=document.getElementById('qrcode');
    var ctx=c.getContext('2d');
    ctx.fillStyle='#FFF0F4';ctx.fillRect(0,0,240,240);
    ctx.fillStyle='#A8405C';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
    ctx.fillText('QR indisponible',120,110);
    ctx.fillText('Utilise le bouton',120,130);
    return;
  }
  new QRious({
    element: document.getElementById('qrcode'),
    value: 'https://dianalivraison.vercel.app/livraison-diana-fixed.html',
    size: 240,
    level: 'H',
    foreground: '#2B1419',
    background: '#ffffff'
  });
})();

function copyUrl(){
  var url='https://dianalivraison.vercel.app/livraison-diana-fixed.html';
  var done=function(){
    var t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(function(){prompt('Copie ce lien :',url);});
  } else {
    prompt('Copie ce lien :',url);
  }
}
</script>
</body>
</html>
